services:
  redis:
    image: ${REDIS_IMAGE:-redis:alpine}
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-6389}:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - bloom-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
  php:
    build:
      context: .
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:cli-alpine}
    profiles: [tools]
    entrypoint: [php]
    working_dir: /demo
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - .:/demo:ro
    depends_on:
      redis:
        condition: service_healthy
volumes:
  bloom-data:
